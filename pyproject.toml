[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pycoolmasternet-async"
dynamic = ["version"]
description = "A python library to control CoolMasterNet HVAC bridges over asyncio."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "On Freund", email = "onfreund@gmail.com" }]
requires-python = ">=3.13"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/OnFreund/pycoolmasternet-async"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools_scm]
# version derived from git tags (e.g. v0.2.4 → 0.2.4)
